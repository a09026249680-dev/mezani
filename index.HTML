<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Rack Simulator - Direct Input Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; }
        #ui-panel { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; border-left: 5px solid #00ffcc; z-index: 100; pointer-events: none; }
        .dim-tag { position: absolute; background: #fff; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; transform: translate(-50%, -100%); pointer-events: none; border: 1px solid #333; }
        /* 入力欄を白くして目立たせ、入力しやすくする */
        .dg .c input[type=text] { background: #eee !important; color: #000 !important; font-weight: bold !important; }
    </style>
</head>
<body>
    <div id="ui-panel">
        <strong>メザニンラック 3Dシミュレーター</strong><br>
        右側パネルの数値（白い欄）を直接書き換えてください
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 100, 1000000);
        camera.position.set(18000, 8000, 15000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(10000, 2000, -5000);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const light = new THREE.DirectionalLight(0xffffff, 0.5);
        light.position.set(10000, 10000, 5000);
        scene.add(light);

        // --- 構造定義 ---
        const SPAN_X = 4000;
        const WIDTH_X = 20000; 
        const HEIGHT_Y = 3900;
        const BEAM_H = 2540;
        const PIL_W = 125; 

        const spansZ = [1000, 1100, 1000, 1500, 1000, 1000, 1000, 1000, 1000];
        const zPositions = [0];
        let currentZ = 0;
        spansZ.forEach(s => {
            currentZ -= (s + PIL_W);
            zPositions.push(currentZ);
        });
        const MAX_DEPTH = Math.abs(currentZ);

        const rackGroup = new THREE.Group();
        const pilMat = new THREE.MeshPhongMaterial({ color: 0x777777 });
        const beamMat = new THREE.MeshPhongMaterial({ color: 0x444444 });

        for (let i = 0; i <= 5; i++) {
            const x = i * SPAN_X;
            zPositions.forEach(z => {
                const pillar = new THREE.Mesh(new THREE.BoxGeometry(PIL_W, HEIGHT_Y, PIL_W), pilMat);
                pillar.position.set(x, HEIGHT_Y / 2, z);
                rackGroup.add(pillar);
            });
            const sideBeam = new THREE.Mesh(new THREE.BoxGeometry(50, 100, MAX_DEPTH), beamMat);
            sideBeam.position.set(x, BEAM_H + 50, -MAX_DEPTH / 2);
            rackGroup.add(sideBeam);
        }
        zPositions.forEach(z => {
            const mainBeam = new THREE.Mesh(new THREE.BoxGeometry(WIDTH_X, 150, 50), beamMat);
            mainBeam.position.set(WIDTH_X / 2, BEAM_H + 75, z);
            rackGroup.add(mainBeam);
        });
        scene.add(rackGroup);
        scene.add(new THREE.GridHelper(40000, 40, 0x333333, 0x333333));

        // --- カーテンシステム ---
        let curtains = [];
        const gui = new dat.GUI({ width: 320 });
        const globalActions = {
            '＋ 新しいカーテンを追加': () => addCurtain(),
            '現在の配置を保存': () => saveState(),
            '保存データを読み込み': () => loadState()
        };
        gui.add(globalActions, '＋ 新しいカーテンを追加');
        gui.add(globalActions, '現在の配置を保存');
        gui.add(globalActions, '保存データを読み込み');

        function addCurtain(initData = null) {
            const id = Date.now() + Math.random(); 
            const data = initData || {
                w: 3900, h: 2540, x: 2000, y: 0, z: 0, 
                rotate: false, color: '#ffcc00', opacity: 0.7,
                snapToSpan: true, spanX: 1, spanZ: 1
            };

            const group = new THREE.Group();
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshPhongMaterial({ side: THREE.DoubleSide, transparent: true, opacity: data.opacity }));
            const bar = new THREE.Mesh(new THREE.CylinderGeometry(20, 20, 1, 16), new THREE.MeshPhongMaterial({ color: 0xcccccc }));
            bar.rotation.z = Math.PI / 2;

            group.add(mesh);
            group.add(bar);
            scene.add(group);

            const tag = document.createElement('div');
            tag.className = 'dim-tag';
            document.body.appendChild(tag);

            const folder = gui.addFolder('カーテン設定 ' + (curtains.length + 1));
            const item = { id, group, mesh, bar, data, tag, folder };

            // 数値入力用のコントローラーを作成
            const ctrlW = folder.add(data, 'w', 0, 20000).name('幅(W)');
            const ctrlH = folder.add(data, 'h', 0, 5000).name('高さ(H)');
            const ctrlX = folder.add(data, 'x', -5000, 25000).name('位置(X)');
            const ctrlZ = folder.add(data, 'z', -20000, 5000).name('位置(Z)');
            const ctrlY = folder.add(data, 'y', 0, 3000).name('床から(Y)');
            
            // 変更があったら自動配置をオフにする（YとH以外）
            const disableSnap = () => { data.snapToSpan = false; update(item); };
            ctrlW.onChange(disableSnap);
            ctrlX.onChange(disableSnap);
            ctrlZ.onChange(disableSnap);
            ctrlH.onChange(() => update(item));
            ctrlY.onChange(() => update(item));

            folder.add(data, 'opacity', 0.1, 1.0).name('不透明度').onChange(() => update(item));
            folder.addColor(data, 'color').name('カーテン色').onChange(() => update(item));
            
            // スパン補助
            const sub = folder.addFolder('自動配置アシスト');
            sub.add(data, 'snapToSpan').name('スパンに吸着させる').listen().onChange(() => update(item));
            sub.add(data, 'rotate').name('左右向き(奥行面)').onChange(() => update(item));
            sub.add(data, 'spanX', { '1番': 1, '2番': 2, '3番': 3, '4番': 4, '5番': 5 }).name('幅スパン番号').onChange(() => update(item));
            sub.add(data, 'spanZ', { '1番': 1, '2番': 2, '3番': 3, '4番': 4, '5番': 5, '6番': 6, '7番': 7, '8番': 8, '9番': 9 }).name('奥行スパン番号').onChange(() => update(item));

            folder.add({ delete: () => removeCurtain(item) }, 'delete').name('❌ このカーテンを削除');
            folder.open();

            curtains.push(item);
            update(item);
        }

        function update(item) {
            if (item.data.snapToSpan) {
                const idxX = parseInt(item.data.spanX) - 1;
                const idxZ = parseInt(item.data.spanZ) - 1;

                if (!item.data.rotate) {
                    item.data.w = SPAN_X - 100;
                    item.data.x = (idxX * SPAN_X) + (SPAN_X / 2);
                    item.data.z = zPositions[idxZ]; 
                } else {
                    const currentSpanZ = spansZ[idxZ];
                    item.data.w = currentSpanZ - 50;
                    item.data.z = zPositions[idxZ] - (currentSpanZ / 2) - (PIL_W / 2);
                    item.data.x = idxX * SPAN_X;
                }
            }

            item.mesh.scale.set(item.data.w, item.data.h, 1);
            item.mesh.position.y = item.data.h / 2;
            item.mesh.material.color.set(item.data.color);
            item.mesh.material.opacity = item.data.opacity;
            
            item.bar.scale.set(1, item.data.w, 1);
            item.bar.position.y = item.data.h;
            item.group.rotation.y = item.data.rotate ? Math.PI / 2 : 0;
            item.group.position.set(item.data.x, item.data.y, item.data.z);
            
            item.tag.innerHTML = `W:${Math.round(item.data.w)} H:${Math.round(item.data.h)}`;
            
            // GUI上の表示を強制更新（手打ち数値を反映させるため）
            for (let i in item.folder.__controllers) {
                item.folder.__controllers[i].updateDisplay();
            }
        }

        function removeCurtain(item) {
            scene.remove(item.group);
            if (item.tag.parentNode) document.body.removeChild(item.tag);
            gui.removeFolder(item.folder);
            curtains = curtains.filter(c => c.id !== item.id);
        }

        function saveState() {
            localStorage.setItem('mezzanine_rack_v9', JSON.stringify(curtains.map(c => c.data)));
            alert('保存しました');
        }

        function loadState() {
            const saved = localStorage.getItem('mezzanine_rack_v9');
            if (!saved) return alert('データなし');
            [...curtains].forEach(c => removeCurtain(c));
            JSON.parse(saved).forEach(data => addCurtain(data));
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            curtains.forEach(item => {
                const vector = new THREE.Vector3();
                vector.setFromMatrixPosition(item.bar.matrixWorld);
                vector.project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
                item.tag.style.left = `${x}px`;
                item.tag.style.top = `${y}px`;
                item.tag.style.display = vector.z > 1 ? 'none' : 'block';
            });
            renderer.render(scene, camera);
        }

        addCurtain();
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
